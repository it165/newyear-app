<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คอินหน้างาน (Check-in)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fdf2f8; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-pink-100 p-6">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-pink-600 tracking-tight">จุดเช็คอิน</h1>
        </div>

        <!-- Loading State -->
        <div id="loadingSection" class="text-center py-8">
            <div class="animate-spin rounded-full h-14 w-14 border-t-2 border-b-2 border-pink-500 mx-auto mb-4"></div>
            <p class="text-pink-600 font-medium animate-pulse" id="loadingText">กำลังตรวจสอบข้อมูลของคุณ...</p>
        </div>

        <!-- Profile Card (Digital ID) -->
        <div id="profileSection" class="hidden animate-fade-in-up">
            <div class="bg-gradient-to-br from-pink-50 to-purple-50 rounded-2xl p-6 text-center shadow-inner border border-pink-100 mb-6">
                <div class="w-24 h-24 mx-auto mb-4 rounded-full p-1 bg-gradient-to-r from-pink-400 to-purple-500 shadow-lg">
                    <img id="displayImg" src="" class="w-full h-full rounded-full object-cover border-4 border-white">
                </div>
                <h2 id="displayName" class="text-2xl font-bold text-gray-800 mb-2">ชื่อพนักงาน</h2>
                <div class="flex justify-center space-x-2 text-sm mt-3">
                    <span class="bg-pink-100 text-pink-700 px-3 py-1.5 rounded-lg font-semibold shadow-sm flex items-center">
                        🆔 <span id="displayId" class="ml-1">รหัส</span>
                    </span>
                    <span class="bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg font-semibold shadow-sm flex items-center">
                        💼 <span id="displayTenure" class="ml-1">อายุงาน</span>
                    </span>
                </div>
            </div>

            <button onclick="processCheckIn()" id="checkinBtn"
                    class="w-full py-4 bg-pink-500 hover:bg-pink-600 text-white rounded-xl font-bold text-lg shadow-[0_8px_20px_rgba(236,72,153,0.3)] hover:shadow-[0_12px_25px_rgba(236,72,153,0.4)] transition-all transform hover:-translate-y-1">
                📍 ยืนยันการเช็คอินหน้างาน
            </button>
        </div>

        <!-- Error State -->
        <div id="errorSection" class="hidden text-center py-6">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-4xl">🤷‍♂️</span>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">ไม่พบข้อมูลของคุณ</h3>
            <p class="text-gray-500 text-sm mb-6">คุณอาจจะยังไม่ได้ลงทะเบียนล่วงหน้า หรือระบบดึงข้อมูลจาก LINE ไม่สำเร็จ</p>
            <button onclick="window.location.reload()" class="text-pink-500 font-semibold px-4 py-2 bg-pink-50 rounded-lg hover:bg-pink-100 transition-colors">
                ↻ ลองโหลดใหม่อีกครั้ง
            </button>
        </div>

        <!-- Debug Box -->
        <div id="debugBox" class="mt-8 p-4 bg-gray-50 rounded-xl text-xs text-gray-600 font-mono hidden border border-gray-200">
            <p class="font-bold mb-2 text-gray-700 border-b pb-1">⚙️ Debug Info:</p>
            <div id="debugLog" class="space-y-1.5"></div>
        </div>

    </div>

    <style>
        .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script>
        // ==========================================
        // 🔴 แก้ไข 2 บรรทัดนี้ให้เป็นข้อมูลของคุณ
        // ==========================================
        const LIFF_ID = "2012560711-stcSyd72"; 
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxhWzgLbIl71f1UTkD2AqZmnHJyTNMnh3pGuaXt9yKtwyy3h1BATD61k7p7R5e1OrnJ/exec"; 
        // ==========================================

        let currentUser = null; // เก็บข้อมูลพนักงานที่ดึงมาจาก API

        async function initializeApp() {
            try {
                addDebug("1. Init LIFF...");
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    addDebug("2. Not logged in. Redirecting...");
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                addDebug(`3. Get Profile Success: ${profile.userId}`);
                
                // ดึงข้อมูลพนักงานจาก Sheet โดยใช้ LINE User ID
                await fetchUserData(profile.userId);

            } catch (err) {
                addDebug(`❌ LIFF Error: ${err.message}`);
                showError();
            }
        }

        async function fetchUserData(lineUid) {
            try {
                document.getElementById('loadingText').innerText = "กำลังค้นหาข้อมูลพนักงาน...";
                addDebug("4. Fetching Data from GAS...");
                
                // ยิง API แบบ GET โดยส่ง uid ไปถามหลังบ้าน
                const url = `${GAS_API_URL}?mode=getProfile&uid=${lineUid}`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.success && result.data) {
                    addDebug("5. Data Found!");
                    currentUser = result.data;
                    currentUser.lineUserId = lineUid; // เก็บ uid ไว้ใช้ตอนส่งเช็คอิน
                    
                    // นำข้อมูลไปโชว์บนบัตร
                    document.getElementById('displayImg').src = currentUser.profileImg || 'https://via.placeholder.com/150';
                    document.getElementById('displayName').innerText = currentUser.name;
                    document.getElementById('displayId').innerText = currentUser.id;
                    document.getElementById('displayTenure').innerText = currentUser.tenure;

                    // สลับหน้าจอไปโชว์บัตร
                    document.getElementById('loadingSection').style.display = 'none';
                    document.getElementById('profileSection').style.display = 'block';
                } else {
                    addDebug("❌ User not found in Sheet");
                    showError();
                }

            } catch (err) {
                addDebug(`❌ Fetch Error: ${err.message}`);
                showError();
            }
        }

        function processCheckIn() {
            const btn = document.getElementById('checkinBtn');
            btn.innerHTML = '<span class="animate-spin inline-block mr-2">↻</span> กำลังบันทึกพิกัด...';
            btn.disabled = true;
            btn.classList.replace('bg-pink-500', 'bg-gray-400');

            // ขอพิกัดผู้ใช้ก่อน
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        sendCheckInData(lat, lng);
                    },
                    (error) => {
                        addDebug("⚠️ Location denied or failed, checking in without GPS.");
                        sendCheckInData("", ""); // เช็คอินโดยไม่มีพิกัด
                    },
                    { timeout: 5000 } // รอพิกัดแค่ 5 วินาที
                );
            } else {
                sendCheckInData("", "");
            }
        }

        async function sendCheckInData(lat, lng) {
            const btn = document.getElementById('checkinBtn');
            btn.innerHTML = '<span class="animate-spin inline-block mr-2">↻</span> ยืนยันการบันทึก...';
            
            try {
                // ส่งข้อมูลไปเซฟที่ GAS
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        mode: 'checkin',
                        uid: currentUser.lineUserId,
                        lat: lat,
                        lng: lng
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();

                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'เช็คอินสำเร็จ!',
                        text: `ยินดีต้อนรับเข้าสู่งานครับ/ค่ะ`,
                        confirmButtonColor: '#EC4899',
                        allowOutsideClick: false
                    }).then(() => {
                        liff.closeWindow(); // ปิด LINE ทันทีที่กด OK
                    });
                } else {
                    throw new Error(result.message || 'บันทึกไม่สำเร็จ');
                }

            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
                btn.innerHTML = '📍 ยืนยันการเช็คอินหน้างาน';
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-pink-500');
            }
        }

        function showError() {
            document.getElementById('loadingSection').style.display = 'none';
            document.getElementById('errorSection').style.display = 'block';
        }

        function addDebug(msg) {
            const dbg = document.getElementById('debugBox');
            const log = document.getElementById('debugLog');
            dbg.classList.remove('hidden');
            log.innerHTML += `<div>${msg}</div>`;
        }

        // เริ่มการทำงาน
        window.onload = initializeApp;
    </script>
</body>
</html>
