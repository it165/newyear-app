<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนร่วมงาน (RSVP)</title>
    <!-- Tailwind CSS สำหรับตกแต่ง -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- SweetAlert2 สำหรับแจ้งเตือน -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fdf2f8; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-card w-full max-w-md rounded-3xl shadow-xl overflow-hidden border border-pink-100 p-6 relative">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm" id="profileImageWrapper">
                <svg class="w-10 h-10 text-pink-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">จุดลงทะเบียนล่วงหน้า</h1>
            <p class="text-gray-500 mt-2 text-sm" id="welcomeText">กรุณากรอกรหัสพนักงานเพื่อยืนยันการเข้าร่วม</p>
        </div>

        <!-- Form -->
        <div class="space-y-4" id="formSection" style="display: none;">
            <div>
                <input type="text" id="empId" placeholder="รหัสพนักงาน (เช่น 001)" 
                       class="w-full px-5 py-4 bg-pink-50 border-2 border-transparent rounded-xl focus:outline-none focus:border-pink-300 focus:bg-white text-center text-lg font-medium transition-all text-gray-700 shadow-inner">
            </div>
            <button onclick="submitRegister()" id="submitBtn"
                    class="w-full py-4 bg-green-500 hover:bg-green-600 text-white rounded-xl font-semibold text-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1">
                ยืนยันการลงทะเบียน
            </button>
        </div>

        <!-- Loading State -->
        <div id="loadingSection" class="text-center py-6">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-pink-500 mx-auto"></div>
            <p class="mt-4 text-pink-600 font-medium animate-pulse">กำลังโหลดระบบ...</p>
        </div>

        <!-- Debug Box -->
        <div id="debugBox" class="mt-6 p-4 bg-red-50 rounded-xl text-xs text-red-600 font-mono hidden border border-red-100">
            <p class="font-bold mb-1 text-red-700 flex items-center"><svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> ข้อมูลตรวจสอบระบบ:</p>
            <div id="debugLog" class="space-y-1"></div>
        </div>

    </div>

    <script>
        // ==========================================
        // 🔴 แก้ไข 2 บรรทัดนี้ให้เป็นข้อมูลของคุณ
        // ==========================================
        const LIFF_ID = "2012560711-Z7dsZBZo"; 
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxhWzgLbIl71f1UTkD2AqZmnHJyTNMnh3pGuaXt9yKtwyy3h1BATD61k7p7R5e1OrnJ/exec"; 
        // ==========================================

        let userProfile = null;

        async function initializeApp() {
            try {
                addDebug("1. กำลังเชื่อมต่อ LIFF...");
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    addDebug("2. ผู้ใช้ยังไม่ล็อกอิน กำลังส่งไปล็อกอิน...");
                    liff.login();
                    return;
                }

                addDebug("3. ล็อกอินสำเร็จ กำลังดึงโปรไฟล์...");
                userProfile = await liff.getProfile();
                addDebug(`4. ดึงโปรไฟล์สำเร็จ (UID: ${userProfile.userId.substring(0,6)}...)`);
                
                // โชว์รูปโปรไฟล์
                if(userProfile.pictureUrl) {
                    document.getElementById('profileImageWrapper').innerHTML = `<img src="${userProfile.pictureUrl}" class="w-full h-full rounded-full object-cover shadow-md border-2 border-white">`;
                }
                
                document.getElementById('welcomeText').innerHTML = `สวัสดีคุณ <b class="text-pink-600">${userProfile.displayName}</b><br>กรุณากรอกรหัสพนักงานเพื่อผูกบัญชี`;
                
                // สลับหน้าจอ
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('formSection').style.display = 'block';

            } catch (err) {
                addDebug(`❌ Error: ${err.message}`);
                document.getElementById('loadingSection').innerHTML = `<p class="text-red-500 font-bold">เกิดข้อผิดพลาดในการเชื่อมต่อระบบ LINE</p>`;
            }
        }

        async function submitRegister() {
            const empId = document.getElementById('empId').value.trim();
            if (!empId) {
                Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสพนักงาน', 'warning');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<span class="animate-spin inline-block mr-2">↻</span> กำลังบันทึก...';
            btn.disabled = true;
            btn.classList.replace('bg-green-500', 'bg-gray-400');

            try {
                // ส่งข้อมูลไปที่ GAS API ด้วย fetch
                const response = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        mode: 'register',
                        empId: empId,
                        lineUserId: userProfile.userId,
                        profileImg: userProfile.pictureUrl,
                        displayName: userProfile.displayName
                    }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } // ใช้ text/plain เลี่ยง CORS
                });

                const result = await response.json();

                if (result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'ลงทะเบียนสำเร็จ!',
                        text: `ยินดีต้อนรับ ${result.name}`,
                        confirmButtonColor: '#10B981'
                    }).then(() => {
                        liff.closeWindow(); // ปิดหน้าต่าง LINE
                    });
                } else {
                    throw new Error(result.message || 'รหัสพนักงานไม่ถูกต้อง');
                }

            } catch (err) {
                Swal.fire('ข้อผิดพลาด', err.message, 'error');
                btn.innerHTML = 'ยืนยันการลงทะเบียน';
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-green-500');
            }
        }

        function addDebug(msg) {
            const dbg = document.getElementById('debugBox');
            const log = document.getElementById('debugLog');
            dbg.classList.remove('hidden');
            log.innerHTML += `<div>- ${msg}</div>`;
        }

        // เริ่มการทำงาน
        window.onload = initializeApp;
    </script>
</body>
</html>
