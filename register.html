<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนล่วงหน้า (RSVP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; color: #334155; min-height: 100vh; }
        .glass-panel { background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border-radius: 1rem; }
        
        /* 1. DARK THEME */
        body.theme-dark { background-color: #0f172a; color: #e2e8f0; }
        body.theme-dark .glass-panel { background: #1e293b; border-color: #334155; }
        body.theme-dark .bg-slate-50 { background-color: #0f172a !important; border-color: #334155 !important; color: #e2e8f0 !important;}
        body.theme-dark .text-slate-800, body.theme-dark .text-slate-700 { color: #f8fafc !important; }
        body.theme-dark .text-slate-500 { color: #94a3b8 !important; }
        body.theme-dark .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #e2e8f0 !important; }

        /* 2. K2Y THEME */
        body.theme-k2y { background-color: #111111; color: #e5e5e5; }
        body.theme-k2y .glass-panel { background: #1a1a1a; border-color: #059669; box-shadow: 0 4px 20px -2px rgba(5, 150, 105, 0.15); }
        body.theme-k2y .bg-slate-50 { background-color: #111111 !important; border-color: #333333 !important; color: #e5e5e5 !important;}
        body.theme-k2y .bg-white { background-color: #1a1a1a !important; border-color: #059669 !important; color: #f5f5f5 !important; }
        body.theme-k2y .text-slate-800 { color: #10b981 !important; }
        body.theme-k2y .text-slate-500 { color: #a3a3a3 !important; }
        body.theme-k2y .bg-emerald-600 { background-color: #10b981 !important; color: #000 !important; }
        body.theme-k2y .hover\:bg-emerald-700:hover { background-color: #059669 !important; }
        body.theme-k2y .bg-emerald-50 { background-color: #064e3b !important; border-color: #022c22 !important; }
        body.theme-k2y .text-emerald-600 { color: #10b981 !important; }

        /* 3. BRIGHT THEME */
        body.theme-bright { background-color: #fdf4ff; color: #701a75; }
        body.theme-bright .glass-panel { background: rgba(255, 255, 255, 0.9); border-color: #fbcfe8; }
        body.theme-bright .bg-slate-50 { background-color: #fce7f3 !important; border-color: #fbcfe8 !important; color: #831843 !important;}
        body.theme-bright .bg-white { background-color: #ffffff !important; border-color: #fbcfe8 !important; color: #831843 !important; }
        body.theme-bright .text-slate-800 { color: #831843 !important; }
        body.theme-bright .text-slate-500 { color: #db2777 !important; }
        body.theme-bright .bg-emerald-600 { background-color: #ec4899 !important; color: #fff !important; }
        body.theme-bright .hover\:bg-emerald-700:hover { background-color: #db2777 !important; }
        body.theme-bright .bg-emerald-50 { background-color: #fdf2f8 !important; border-color: #fbcfe8 !important; }
        body.theme-bright .text-emerald-600 { color: #ec4899 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const isGAS = typeof google !== 'undefined' && google.script;

        const RegisterApp = () => {
            const [urlData, setUrlData] = React.useState({});
            const [loading, setLoading] = React.useState(true);
            const [employees, setEmployees] = React.useState([]);
            const [settings, setSettings] = React.useState({});

            const [liffProfile, setLiffProfile] = React.useState(null);
            const [isLiffInit, setIsLiffInit] = React.useState(false);
            const [empIdInput, setEmpIdInput] = React.useState('');
            const [statusHtml, setStatusHtml] = React.useState(null);
            const [isRegistering, setIsRegistering] = React.useState(false);

            const loadData = () => {
                if (isGAS) {
                    google.script.run.withSuccessHandler(data => {
                        const d = data || {};
                        setEmployees(d.employees || []);
                        setSettings(d.settings || {});
                        setLoading(false);
                    }).withFailureHandler(err => {
                        console.error('Data Load Error:', err);
                        setLoading(false);
                    }).loadAllData();
                } else {
                    setTimeout(() => {
                        setEmployees([{ id: '001', name: 'พนักงาน ทดสอบ', tenure: '1-5 ปี', checkedIn: false, rsvp: false, lineUserId: 'U123' }]);
                        setSettings({ theme: 'standard' });
                        setLoading(false);
                    }, 800);
                }
            };

            React.useEffect(() => {
                if (isGAS) {
                    google.script.url.getLocation(function(location) {
                        if (location && location.parameter) {
                            setUrlData({ 
                                mode: location.parameter.mode, 
                                uid: location.parameter.uid, 
                                empId: location.parameter.empId 
                            });
                        }
                        loadData();
                    });
                } else {
                    const params = new URLSearchParams(window.location.search);
                    setUrlData({ mode: params.get('mode'), uid: params.get('uid'), empId: params.get('empId') });
                    loadData();
                }
            }, []);

            React.useEffect(() => {
                if (settings && settings.theme) document.body.className = `theme-${settings.theme}`;
                else document.body.className = 'theme-standard';
            }, [settings]);

            // LIFF Init 
            React.useEffect(() => {
                if (!settings || !settings.liffId || typeof liff === 'undefined') return;
                
                let isMounted = true;
                setIsLiffInit(true);
                
                const fallbackTimer = setTimeout(() => { if (isMounted) setIsLiffInit(false); }, 5000);

                liff.init({ liffId: settings.liffId }).then(() => {
                    clearTimeout(fallbackTimer);
                    if (!isMounted) return;
                    
                    if (liff.isLoggedIn()) {
                        liff.getProfile().then(profile => {
                            if (isMounted) { setLiffProfile(profile); setIsLiffInit(false); }
                        }).catch(() => { if (isMounted) setIsLiffInit(false); });
                    } else {
                        // บังคับล็อกอินผ่าน LINE เสมอ เพื่อให้ดึงโปรไฟล์และ LINE ID ได้
                        liff.login();
                    }
                }).catch((err) => {
                    console.error("LIFF Init Error:", err);
                    clearTimeout(fallbackTimer);
                    if (isMounted) setIsLiffInit(false);
                });
                
                return () => { isMounted = false; clearTimeout(fallbackTimer); };
            }, [settings]);

            const autoMatchUser = React.useMemo(() => {
                if (!employees || employees.length === 0) return null;
                if (liffProfile) return employees.find(e => e.lineUserId === liffProfile.userId);
                if (urlData && urlData.uid) return employees.find(e => e.lineUserId === urlData.uid);
                if (urlData && urlData.empId) return employees.find(e => e.id === urlData.empId);
                return null;
            }, [urlData, employees, liffProfile]);

            const processRegister = (id) => {
                if(!id || !id.trim()) return;
                setStatusHtml(null); 
                setIsRegistering(true);
                
                // ดึงข้อมูลไอดี และ รูปโปรไฟล์ จาก LINE
                const lineId = liffProfile ? liffProfile.userId : (urlData.uid || '');
                const profileImg = liffProfile ? liffProfile.pictureUrl : '';

                if (isGAS) {
                    google.script.run
                    .withSuccessHandler(res => {
                        setIsRegistering(false);
                        if (res.success) {
                            setStatusHtml(<span className="text-emerald-600 font-bold"><i className="fas fa-check-circle mr-2"></i> {res.message}</span>);
                            setEmpIdInput('');
                            loadData(); 
                        } else {
                            setStatusHtml(<span className="text-rose-600 font-bold"><i className="fas fa-times-circle mr-2"></i> {res.message}</span>);
                        }
                    })
                    .withFailureHandler(err => {
                        setIsRegistering(false);
                        console.error('Register Error:', err);
                        setStatusHtml(<span className="text-rose-600 font-bold"><i className="fas fa-exclamation-triangle mr-2"></i> ระบบขัดข้อง: {err.message}</span>);
                    })
                    .doRegisterWeb(id.trim(), lineId, profileImg); // ส่งรูปโปรไฟล์ไปหลังบ้านด้วย
                } else {
                    setTimeout(() => {
                        setIsRegistering(false);
                        setStatusHtml(<span className="text-emerald-600 font-bold"><i className="fas fa-check-circle mr-2"></i> ลงทะเบียนจำลองสำเร็จ</span>);
                        setEmpIdInput('');
                        let updatedEmps = [...employees];
                        let empIndex = updatedEmps.findIndex(e => e.id === id.trim());
                        if (empIndex > -1) updatedEmps[empIndex].rsvp = true;
                        setEmployees(updatedEmps);
                    }, 800);
                }
            };

            const handleManualSubmit = (e) => {
                e.preventDefault();
                processRegister(empIdInput);
            };

            if (loading) return <div className="flex h-screen items-center justify-center text-slate-500 text-xl"><i className="fas fa-spinner fa-spin mr-3"></i> กำลังโหลดข้อมูล...</div>;

            return (
                <div className="container mx-auto px-4 py-8 max-w-5xl h-screen flex flex-col justify-center">
                    {autoMatchUser ? (
                        <div className="glass-panel p-8 md:p-12 max-w-md w-full mx-auto text-center relative overflow-hidden shadow-2xl">
                            <div className="absolute top-0 left-0 w-full h-1.5 bg-emerald-600"></div>
                            
                            <img src={autoMatchUser.profileImg || `https://placehold.co/150x150/e2e8f0/475569?text=${encodeURIComponent(autoMatchUser.name.substring(0,2))}`} alt={autoMatchUser.name} className="w-32 h-32 mx-auto rounded-full border-4 border-white shadow-lg mb-6 object-cover bg-slate-100" />
                            
                            <h2 className="text-3xl font-bold mb-2 text-slate-800">{autoMatchUser.name}</h2>
                            <p className="mb-8 text-slate-500 font-medium">รหัสพนักงาน: {autoMatchUser.id}</p>
                            
                            {autoMatchUser.rsvp ? (
                                <div className="bg-emerald-50 text-emerald-600 p-4 rounded-xl border border-emerald-200 font-bold text-lg mb-6">
                                    <i className="fas fa-check-circle mr-2"></i> คุณได้ลงทะเบียนเข้าร่วมงานแล้ว
                                </div>
                            ) : (
                                <button onClick={() => processRegister(autoMatchUser.id)} disabled={isRegistering} className={`w-full text-white text-lg font-bold py-4 rounded-xl transition-all shadow-lg ${isRegistering ? 'bg-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 hover:shadow-emerald-500/30'}`}>
                                    {isRegistering ? <span><i className="fas fa-spinner fa-spin mr-2"></i> กำลังบันทึก...</span> : <span><i className="fas fa-clipboard-check mr-2"></i> ยืนยันการเข้าร่วมงาน</span>}
                                </button>
                            )}
                            
                            {statusHtml && <div className="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-100">{statusHtml}</div>}
                        </div>
                    ) : (
                        <div className="glass-panel p-8 md:p-12 max-w-md w-full mx-auto text-center relative overflow-hidden shadow-2xl">
                            <div className="absolute top-0 left-0 w-full h-1.5 bg-emerald-600"></div>
                            <div className="inline-block p-5 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 text-4xl mb-6 shadow-inner">
                                <i className="fas fa-clipboard-list"></i>
                            </div>
                            <h2 className="text-3xl font-bold mb-3 text-slate-800">ลงทะเบียนล่วงหน้า</h2>
                            
                            {isLiffInit ? (
                                <div className="py-8 text-slate-500 font-medium animate-pulse">
                                    <i className="fas fa-spinner fa-spin text-2xl mb-3 text-emerald-600"></i><br/>กำลังดึงข้อมูลจาก LINE...
                                </div>
                            ) : (
                                <React.Fragment>
                                    <p className="mb-4 text-slate-500">กรุณากรอกรหัสพนักงานเพื่อยืนยันการเข้าร่วมงานปีใหม่</p>
                                    
                                    {/* กล่อง Debug เพื่อหาสาเหตุในหน้าลงทะเบียน */}
                                    {(!liffProfile || !settings.liffId) && (
                                        <div className="bg-slate-50 p-4 rounded-xl text-left text-xs text-slate-600 mb-6 font-mono overflow-auto border border-slate-200">
                                            <div className="font-bold text-slate-700 mb-2 border-b border-slate-200 pb-2"><i className="fas fa-bug text-rose-500 mr-1"></i> ข้อมูลตรวจสอบระบบ (RSVP):</div>
                                            <div className="mb-1">1. ตั้งค่า LIFF ID: {settings && settings.liffId ? <span className="text-emerald-600 font-bold">มีข้อมูล ({settings.liffId})</span> : <span className="text-rose-600 font-bold">ว่างเปล่า (ยังไม่ตั้งค่าในหน้าแอดมิน)</span>}</div>
                                            <div className="mb-1">2. สถานะ LINE: {liffProfile ? <span className="text-emerald-600 font-bold">ดึงข้อมูลสำเร็จ</span> : <span className="text-rose-600 font-bold">ดึงข้อมูลไม่ได้ (ไม่ได้ Login)</span>}</div>
                                        </div>
                                    )}

                                    <form onSubmit={handleManualSubmit}>
                                        <input type="text" value={empIdInput} onChange={e => setEmpIdInput(e.target.value)} placeholder="รหัสพนักงาน (เช่น 001)" className="w-full text-center text-3xl p-5 rounded-xl text-slate-800 bg-slate-50 border-2 border-slate-200 focus:border-emerald-600 focus:bg-white outline-none mb-6 transition-all placeholder:text-slate-300 font-mono tracking-widest uppercase" autoFocus disabled={isRegistering} />
                                        <button type="submit" disabled={isRegistering} className={`w-full text-white text-lg font-bold py-4 rounded-xl transition-all shadow-lg ${isRegistering ? 'bg-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 hover:shadow-emerald-500/30'}`}>
                                            {isRegistering ? <span><i className="fas fa-spinner fa-spin mr-2"></i> กำลังตรวจสอบ...</span> : 'ยืนยันการลงทะเบียน'}
                                        </button>
                                    </form>
                                </React.Fragment>
                            )}
                            
                            {statusHtml && <div className="mt-8 p-4 bg-slate-50 rounded-xl border border-slate-100">{statusHtml}</div>}
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<RegisterApp />, document.getElementById('root'));
    </script>
</body>
</html>
